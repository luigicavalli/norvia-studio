<div class="inp-wrapper">

  @if (label()) {
    <label class="inp-label" [for]="inputId">{{ label() }}</label>
  }

  <div class="inp-container" [class]="containerClasses()">
    <ng-content select="[icon-left]" />

    <input
      class="inp"
      [id]="inputId"
      [type]="effectiveType()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readOnly()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onTouched()"
    />

    <ng-content select="[icon-right]" />

    @if (type() === 'password') {
      <button class="inp-eye" type="button" tabindex="-1" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'Nascondi password' : 'Mostra password'">
        @if (showPassword()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    }
  </div>

  @if (error() && errorMessage()) {
    <span class="inp-message inp-message--error">{{ errorMessage() }}</span>
  } @else if (hint()) {
    <span class="inp-message">{{ hint() }}</span>
  }

</div>
