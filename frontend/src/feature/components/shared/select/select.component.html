<div class="sel-wrapper">

  @if (label()) {
    <label class="sel-label" [for]="selectId">{{ label() }}</label>
  }

  <div class="sel-container" [class]="containerClasses()">

    <button
      class="sel-trigger"
      type="button"
      [id]="selectId"
      [disabled]="isDisabled()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      (click)="toggle()"
      (keydown)="onKeydown($event)"
      (blur)="onTouched()"
    >
      <span [class.sel-trigger__placeholder]="selectedLabel() === null">
        {{ selectedLabel() ?? placeholder() }}
      </span>
    </button>

    <span class="sel-chevron" [class.sel-chevron--open]="isOpen()" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </span>

    @if (isOpen()) {
      <div class="sel-dropdown" role="listbox" [style]="dropdownStyle()">
        @for (option of options(); track option.value; let i = $index) {
          <div
            class="sel-option"
            role="option"
            [class.sel-option--selected]="option.value === value()"
            [class.sel-option--focused]="focusedIndex() === i"
            [class.sel-option--disabled]="option.disabled"
            [attr.aria-selected]="option.value === value()"
            [attr.aria-disabled]="option.disabled ?? false"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </div>
        }
      </div>
    }

  </div>

  @if (error() && errorMessage()) {
    <span class="sel-message sel-message--error">{{ errorMessage() }}</span>
  } @else if (hint()) {
    <span class="sel-message">{{ hint() }}</span>
  }

</div>
