version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flowdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk_pass
      POSTGRES_DB: flowdesk_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowdesk -d flowdesk_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin (optional, for GUI) ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flowdesk_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flowdesk.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools  # only starts with: docker compose --profile tools up

volumes:
  postgres_data: