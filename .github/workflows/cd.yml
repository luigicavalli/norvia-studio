name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend → Cloud Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/norvia-backend

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --set-secrets "SUPABASE_DB_URL=SUPABASE_URL:latest,SUPABASE_SCHEMA=SUPABASE_SCHEMA:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,CORS_ORIGIN=CORS_ORIGIN:latest,SENTRY_DSN=SENTRY_DSN_BACKEND:latest,CLERK_WEBHOOK_SECRET=CLERK_WEBHOOK_SECRET:latest,CLERK_INVITE_REDIRECT_URL=CLERK_INVITE_REDIRECT_URL:latest"

  deploy-frontend:
    name: Deploy Frontend → Firebase Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Create environment files
        run: |
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production:          false,
            clerkPublishableKey: '${{ secrets.CLERK_PUBLISHABLE_KEY }}',
            apiUrl:              '${{ secrets.API_URL }}',
            sentryDsn:           '',
          };
          EOF
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production:          true,
            clerkPublishableKey: '${{ secrets.CLERK_PUBLISHABLE_KEY }}',
            apiUrl:              '${{ secrets.API_URL }}',
            sentryDsn:           '${{ secrets.SENTRY_DSN_FRONTEND }}',
          };
          EOF

      - name: Build
        run: npm run build -- --configuration production

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }}
